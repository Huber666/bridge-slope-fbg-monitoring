<polyline points="410,295 1120,295" fill="none" stroke="#657d88" stroke-width="9"/>
<rect x="730" y="280" width="80" height="15" fill="#b13c34" stroke="#20313b" stroke-width="2"/>
<polyline points="810,280 860,230 1410,230" fill="none" stroke="#24647d" stroke-width="5"/>
<text x="125" y="145" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#20313b">金属载体上粘FBG</text>

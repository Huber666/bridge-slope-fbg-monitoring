<text x="45" y="936">体积校核：基底0.96 + 主动层2.08 = 3.04 m³；湿土约4.56–5.47 t（不含箱体与外加载荷）。</text>
<text x="45" y="973" class="sm">B图只画24个应变点；另有位移2、温度4、可选动态2，共30/32点。跳线及非感测段另绘竣工点表。</text>

<text x="740" y="661">① 装置固定：箱底支座→核定承载基础</text><text x="740" y="700">② 构件固定：网片/梁→定义明确的锚点</text><text x="740" y="739">③ 传感固定：夹具/胶→有效标距，避免旁路</text>

<text x="70" y="807" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#20313b">图示为s300测线局部平面；y显示200—700 mm。灰色为局部锚片，红线为转换梁。</text>
<text x="70" y="868" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#20313b">底部差动可能经土拱和剪切扩散而改变；d80处两锚点的相对运动必须独立测得。</text>
<text x="70" y="932" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#20313b">M2避免对称下沉只使梁跨中受土压的歧义；若变形区偏移，按土内参考调整测线。</text>

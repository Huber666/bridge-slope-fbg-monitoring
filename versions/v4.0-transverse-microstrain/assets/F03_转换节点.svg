<text x="80" y="634" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#20313b">SUS301弹性片：宽10；厚0.3 / 0.5 / 0.8三组；柔性护罩不跨接传力。</text>
<polyline points="410,305 410,525 380,525" fill="none" stroke="#b13c34" stroke-width="2"/>
<text x="80" y="709" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#20313b">测法向 n 差动：宽面平行土面。测顺坡 s 差动：薄片绕 y 轴转90°。</text>
<text x="80" y="769" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#20313b">t = 0.5时理想响应 0.0781 με/μm；10 μm仅约0.781 με，须实测噪声。</text>
<text x="80" y="835" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#24647d">感测段 → 渐变柔性过渡 → 松套连接 → 箱外铠装或可拆保护管</text>
<text x="80" y="899" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#20313b">固定导向梁仅为计算假设。锚片转动和拔滑必须独立量测。</text>
<text x="80" y="956" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#20313b">尺寸单位 mm；仅作样件制造讨论，夹具、胶层及限位在样件标定后冻结。</text>

<text x="80" y="709" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#20313b">各事件顺序可变，负提前量照实记录；无破坏时不填写破坏提前量。</text>
<text x="80" y="773" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#20313b">训练测试按独立重建分组；30 h零误报的泊松95%上界仍约0.1次/h。</text>

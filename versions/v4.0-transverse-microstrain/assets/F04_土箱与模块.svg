<text x="140" y="554" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#20313b">干燥机械层  高度按驱动器确定</text>
<text x="1050" y="214" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#20313b">净高 300</text>
<text x="1050" y="255" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#20313b">土厚 160</text>
<text x="1050" y="296" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#20313b">8层 × 20</text>
<text x="1050" y="368" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#20313b">d从土面向下</text>
<text x="1050" y="408" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#20313b">红线默认 d80</text>
<text x="1050" y="448" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#20313b">另次比较 d40/120</text>
<text x="80" y="649" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#20313b">304底板3 + 连续网格承托；外架方管30 × 30 × 3候选。</text>
<text x="80" y="704" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#20313b">PC观察壁8 + 外压框；接缝EPDM密封；执行器与相机另架支承。</text>
<text x="80" y="773" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#20313b">M1 双盘差动</text>
<text x="80" y="813" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#20313b">沿y张开 / 沿s剪切</text>
<text x="590" y="773" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#20313b">M2 局部下沉板</text>
<text x="590" y="813" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#20313b">100 × 100 支承卸载</text>
<text x="1100" y="773" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#20313b">M3 局部托盘</text>
<text x="1100" y="813" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#20313b">200 × 200 缓慢错动</text>
<text x="80" y="891" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#20313b">示意图未按板厚放大比例绘制。每次只安装一种模块，底板连续性随接口复核。</text>
<text x="80" y="946" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#20313b">水平土箱用于机制与耦合验证；坡槽阶段另定坡角和几何，保留V3 CAD作历史参考。</text>
</svg>